name: validate-semantic-atlas

on:
  pull_request:
  push:
    branches:
      - main
      - 'architecture/**'
      - 'feature/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up fixed Python runtime
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-test.txt

      - name: Validate canonical objects
        run: python build/validate_atlas.py --root .

      - name: Validate typed UUID identities
        run: python build/validate_ids.py --root .

      - name: Run architecture regressions
        run: python -m unittest discover -s tests -v

      - name: Verify staging mapper has no canonical write surface
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('build/map_research_staging.py').read_text(encoding='utf-8')
          forbidden = ['atlas/sources', 'atlas/evidence', 'atlas/nodes', 'atlas/propositions', 'atlas/adjudications']
          hits = [item for item in forbidden if item in text]
          if hits:
              raise SystemExit(f'forbidden canonical write path literals in staging mapper: {hits}')
          print('PASS: staging mapper exposes no canonical atlas write path literals')
          PY

      - name: Build derived outputs twice
        run: |
          rm -rf /tmp/atlas-build-a /tmp/atlas-build-b
          python build/build_current_view.py --root . --out /tmp/atlas-build-a > /tmp/hash-a.json
          python build/build_current_view.py --root . --out /tmp/atlas-build-b > /tmp/hash-b.json
          cmp /tmp/hash-a.json /tmp/hash-b.json
          cmp /tmp/atlas-build-a/current_view.json /tmp/atlas-build-b/current_view.json
          cmp /tmp/atlas-build-a/semantic_index.sqlite /tmp/atlas-build-b/semantic_index.sqlite
