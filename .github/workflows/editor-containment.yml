name: Semantic Atlas editor startup containment

on:
  pull_request:
    paths:
      - '.vscode/**'
      - '.gitignore'
      - 'public/fonts/fa-solid-600.ttf'
      - 'tests/test_editor_containment_clean_main_v1.py'
      - 'tests/test_workspace_startup_safety.py'
      - '.github/workflows/editor-containment.yml'
  push:
    branches: [main]
    paths:
      - '.vscode/**'
      - '.gitignore'
      - 'public/fonts/fa-solid-600.ttf'
      - 'tests/test_editor_containment_clean_main_v1.py'
      - 'tests/test_workspace_startup_safety.py'
      - '.github/workflows/editor-containment.yml'

permissions:
  contents: read

jobs:
  source-only-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout no saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check source only: never execute editor tasks
        run: python -B -m unittest tests.test_editor_containment_clean_main_v1 tests.test_workspace_startup_safety -v
      - name: Optimized source checks
        run: python -O -B -m unittest tests.test_editor_containment_clean_main_v1 tests.test_workspace_startup_safety -v
